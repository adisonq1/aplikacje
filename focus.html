<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pseudoelement after</title>
    <style>
    p::before {
 	  content: " - Remember this";
	   }
</style>
</head>
<body>
<h1>Pseudoelement <b>::after</b> formatuje treść za selektorami</h1>
<p>My name is Donald.</p>
<p>I live in Duckburg.</p>
</body>              
</html>
