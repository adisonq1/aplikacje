<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Selektor atrybutu</title>
    <style>
        a[target="_blank"] {
            background-color: yellow
        }
    </style>
    
</head>
<body>
	<h2>CSS [attribute] Selector</h2>
    <p>Select and style the links with a target attribute:</p><br>
    <a href="https://zsgsucha.pl" target="_blank">ZSG SUCHA</a><br>
    <a href="https://zsgsucha.pl/technika/" target="_top">Technika</a>
</body>
</html>
